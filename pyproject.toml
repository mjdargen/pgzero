[project]
name = "pgzero-mjd"
version = "0.0.1"
description = "A custom Pygame Zero build for class use"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [
    {name = "Michael D'Argenio", email = "mjdargen@gmail.com"},
]
requires-python = ">=3.6, <3.14"
dependencies = [
    "pygame>=2.6.1",
    "numpy",
    "pyfxr",
]
keywords = ["pygame", "pgzero", "games", "education"]
classifiers = [
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]

[project.urls]
Documentation = "https://pygame-zero.readthedocs.io/"
Source = "https://github.com/mjdargen/pgzero"

[project.scripts]
pgzrun = "pgzero.runner:main"

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pgzrun"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgzero = ["data/*"]

[tool.ruff]
builtins = [
    "screen",  # graphics output

    "Actor",
    "Sprite",
    "SpriteActor",
    "images",  # graphics

    "sounds",
    "music",
    "tone",  # sound

    "clock",
    "animate",  # timing

    "Rect",
    "ZRect",  # geometry

    "keyboard",
    "mouse",
    "keys",
    "keymods",  # input

    "storage",  # persistence

    "Game",
    "game",

    "exit",

    "load_tile_map_actors",
]
