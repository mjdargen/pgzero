[project]
name = "pgzero-plus"
version = "1.0.0"
description = "An enhanced fork of Pygame Zero with additional features for teaching and developing 2D games"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
    {name = "Michael D'Argenio", email = "mjdargen@gmail.com"},
]
requires-python = ">=3.6"
dependencies = [
    # Both provide the pygame module. pygame-ce is actively developed but
    # needs Python 3.10+, so older Pythons use pygame.
    # The upper limits stop a future major version from changing students'
    # installs overnight; raise them after testing the new version.
    "pygame>=2.6.1,<3; python_version < '3.10'",
    "pygame-ce>=2.5.8,<3; python_version >= '3.10'",
    "numpy<3",
    "importlib-metadata==4.8.3; python_version < '3.8'",
]
keywords = ["pygame", "pgzero", "games", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/mjdargen/pgzero"
Documentation = "https://pgzero-plus.readthedocs.io/"
Source = "https://github.com/mjdargen/pgzero"
Issues = "https://github.com/mjdargen/pgzero/issues"

[project.scripts]
pgzrun = "pgzero.runner:main"

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pgzrun"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgzero = ["data/*"]
