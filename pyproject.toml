[project]
name = "pgzero-plus"
version = "0.1.0"
description = "An enhanced fork of Pygame Zero with additional features for teaching and developing 2D games"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
    {name = "Michael D'Argenio", email = "mjdargen@gmail.com"},
]
requires-python = ">=3.6, <3.14"
dependencies = [
    "pygame>=2.6.1",
    "numpy",
    "pyfxr>=0.3.0",
]
keywords = ["pygame", "pgzero", "games", "education"]
classifiers = [
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/mjdargen/pgzero"
Documentation = "https://pygame-zero.readthedocs.io/"
Source = "https://github.com/mjdargen/pgzero"
Issues = "https://github.com/mjdargen/pgzero/issues"

[project.scripts]
pgzrun = "pgzero.runner:main"

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pgzrun"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgzero = ["data/*"]
