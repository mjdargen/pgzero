name: Release to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Verify, test, document, and build the release
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify the tag matches pyproject.toml
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)["project"]

          if project["name"] != "pgzero-plus":
              raise SystemExit("Unexpected project name in pyproject.toml")
          if project["version"] != tag[1:]:
              raise SystemExit(
                  f"Tag {tag} does not match pyproject.toml version {project['version']}"
              )
          print(f"Building pgzero-plus {project['version']}")
          PY

      - name: Install dependencies
        run: python -m pip install -e . pytest pre-commit build twine sphinx

      - name: Run pre-commit checks
        run: python -m pre_commit run --all-files

      - name: Run tests
        run: python -m pytest

      - name: Build documentation
        run: python -m sphinx -b html doc doc/_build/html

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Save release distributions
        uses: actions/upload-artifact@v6
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pgzero-plus
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-distributions
          path: dist/

      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-distributions
          path: dist/

      - name: Create release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
