# Publishes pgzero-mjd to PyPI. Two ways a release starts:
#
#   1. Every push to main (a merged PR is a push to main) bumps the MINOR
#      version automatically: v0.0.1 -> v0.1.0 -> v0.2.0 -> ...
#      The workflow writes the new version into pyproject.toml, builds and
#      publishes it, then commits and tags it and creates a GitHub Release.
#
#   2. Pushing a tag like v1.0.0 by hand publishes exactly that version.
#      Use this for a major bump. The next merge to main then continues
#      from it (v1.1.0).
#
# One-time setup: add a PyPI API token as the repository secret
# PYPI_API_TOKEN (see "Publishing to PyPI" in README.md).

name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"

# Needed to push the release commit and tag, and to create the GitHub Release.
permissions:
  contents: write

# Never run two releases at the same time; queue them instead.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Step one: decide what version to publish, or decide to do nothing.
  plan:
    runs-on: ubuntu-latest
    # Belt and braces against loops: this workflow's own "chore(release): ..."
    # commits are pushed with GITHUB_TOKEN, which never triggers another
    # workflow run, but skip them explicitly too. The check only applies to
    # branch pushes: a tag that Mike puts on a release commit must still run.
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):')
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      mode: ${{ steps.version.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the whole history so git can see the existing tags.
          fetch-depth: 0

      - name: Work out the version to publish
        id: version
        run: |
          set -euo pipefail

          # A release tag always looks like vMAJOR.MINOR.PATCH, e.g. v1.0.0.
          RELEASE_TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # --- A tag was pushed by hand. Publish exactly that version. ---
            TAG="$GITHUB_REF_NAME"
            if ! [[ "$TAG" =~ $RELEASE_TAG_PATTERN ]]; then
              echo "::error::Tag '$TAG' is not a release tag. Use vMAJOR.MINOR.PATCH, for example v1.0.0."
              exit 1
            fi
            MODE=tag
          else
            # --- A push to main. Bump the minor version automatically. ---
            MODE=bump

            # If this commit already has a release tag, the tag push triggers
            # its own run of this workflow. Don't bump a second time.
            ALREADY_TAGGED="$(git tag --points-at HEAD --list 'v[0-9]*')"
            if [ -n "$ALREADY_TAGGED" ]; then
              echo "This commit is already tagged ($ALREADY_TAGGED). The tag run publishes it; nothing to do here."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Find the most recent release tag in this commit's history.
            # A repo with no release tags yet starts from v0.0.0.
            LAST="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            if ! [[ "$LAST" =~ $RELEASE_TAG_PATTERN ]]; then
              echo "::error::Latest release tag '$LAST' is not vMAJOR.MINOR.PATCH, so the next version can't be worked out."
              exit 1
            fi

            # Split "v0.3.1" into MAJOR=0 MINOR=3 PATCH=1, then bump: v0.4.0
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            TAG="v${MAJOR}.$((MINOR + 1)).0"
            echo "Latest release tag is $LAST (patch $PATCH); next is $TAG."

            # The tag should not exist yet (it could, if someone tagged a
            # commit that is not in main's history). Stop rather than guess.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists but is not in main's history. Push a higher tag by hand, e.g. git tag -a v${MAJOR}.$((MINOR + 2)).0"
              exit 1
            fi
          fi

          # The PyPI version is the tag without its leading "v".
          VERSION="${TAG#v}"
          echo "Publishing version $VERSION (tag $TAG, mode $MODE)."
          {
            echo "skip=false"
            echo "mode=$MODE"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  # Step two: set the version, build, publish, and record the release.
  publish:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the version into pyproject.toml
        run: |
          set -euo pipefail
          # Replace the whole `version = "..."` line, wherever it sits.
          sed -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" pyproject.toml > pyproject.toml.new
          mv pyproject.toml.new pyproject.toml
          if ! grep -q "^version = \"$VERSION\"$" pyproject.toml; then
            echo "::error::Could not find a 'version = \"...\"' line in pyproject.toml to update."
            exit 1
          fi
          git --no-pager diff -- pyproject.toml

      - name: Build the sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PyPI never accepts the same version twice. If this version is
          # already there something went wrong, so fail loudly rather than
          # pretend it worked.
          skip-existing: false
          # Attestations need PyPI "trusted publishing"; this uses a token.
          attestations: false

      - name: Commit and tag the release on main
        if: env.MODE == 'bump'
        run: |
          set -euo pipefail
          # This runs only after the upload succeeded, so a failed upload (for
          # example a missing PYPI_API_TOKEN) leaves no stray tag behind and the
          # job can simply be re-run once the problem is fixed.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          # Push the commit and the tag together (all or nothing). If main
          # moved while this job was running the push is rejected: the version
          # is on PyPI but untagged, so tag the built commit by hand:
          #   git tag -a $TAG -m $TAG $GITHUB_SHA && git push origin $TAG
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Create the GitHub Release with the built files attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release already exists (for example it was created from the
            # GitHub web UI, which is what pushed the tag). Just attach files.
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

      - name: Record the version on main (tag pushed by hand)
        if: env.MODE == 'tag'
        run: |
          set -euo pipefail
          # Keep pyproject.toml on main in step with what was just published,
          # but only when the tag sits on the current head of main. Otherwise a
          # version commit on main would describe a different commit.
          git fetch origin main
          TAGGED_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          if [ "$TAGGED_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "Tag $TAG is on $TAGGED_COMMIT but main is at $MAIN_COMMIT, so pyproject.toml on main is left alone."
            echo "Bump the version line in pyproject.toml by hand if you want main to say $VERSION."
            exit 0
          fi
          if git diff --quiet -- pyproject.toml; then
            echo "pyproject.toml already says $VERSION; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git push origin HEAD:main
