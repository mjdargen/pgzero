name: Code Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Pre-commit, tests, docs, and build
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pre-commit checks
        run: python -m pre_commit run --all-files

      - name: Run tests
        run: python -m pytest

      - name: Build documentation
        run: python -m sphinx -b html doc doc/_build/html

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Save wheel for compatibility tests
        uses: actions/upload-artifact@v6
        with:
          name: check-wheel
          path: dist/*.whl
          if-no-files-found: error

  python-compatibility:
    name: Python ${{ matrix.python-version }} wheel tests
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v6
        with:
          name: check-wheel
          path: dist/

      - name: Install built wheel and pytest
        run: python -m pip install dist/*.whl pytest

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests against installed wheel
        run: python -m pytest

  legacy-python-compatibility:
    name: Python ${{ matrix.python-version }} wheel tests
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.7", "3.8"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: check-wheel
          path: dist/

      # Test the built wheel instead of building source with an old Python.
      # importlib-metadata supplies importlib.metadata on Python 3.6 and 3.7.
      - name: Install wheel and run tests under Python ${{ matrix.python-version }}
        run: |
          docker run --rm \
            -e SDL_VIDEODRIVER=dummy \
            -e SDL_AUDIODRIVER=dummy \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:${{ matrix.python-version }} /bin/sh -c '
              set -eu
              python -m pip install --only-binary=:all: \
                dist/*.whl "pytest==6.2.5" "importlib-metadata==4.8.3"
              python -m pip check
              python -m pytest
            '
